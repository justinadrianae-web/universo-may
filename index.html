<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Universo de May 💜</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #030008; font-family: 'Helvetica', sans-serif; }
        canvas { display: block; }
        
        #ui { position: absolute; top: 15px; width: 100%; text-align: center; color: #E0B0FF; text-shadow: 0 0 10px #9B59B6; pointer-events: none; z-index: 5; }
        #ui h1 { margin: 0; font-size: 2em; }
        #ui p { margin: 5px 0 0 0; color: white; font-size: 1.1em; }

        #modal {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(15, 0, 30, 0.95); border: 2px solid #DDA0DD; border-radius: 20px;
            padding: 40px; text-align: center; color: white; box-shadow: 0 0 40px #FF00FF;
            width: 80%; max-width: 500px; z-index: 10; backdrop-filter: blur(5px);
        }
        #modal h2 { margin: 0 0 15px 0; font-size: 2.2em; color: #E0B0FF; text-shadow: 0 0 10px #DDA0DD; }
        #modal p { font-size: 1.6em; line-height: 1.5; font-style: italic; }
        #close-btn {
            background: #9B59B6; border: 2px solid #E0B0FF; color: white; padding: 12px 25px; 
            font-size: 1.2em; border-radius: 12px; cursor: pointer; margin-top: 25px; 
            box-shadow: 0 0 15px #9B59B6; transition: 0.3s;
        }
        #close-btn:hover { background: #E0B0FF; color: #30004a; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>✨ El Universo de May ✨</h1>
        <p>Gira la galaxia y toca las estrellas gigantes 👆</p>
    </div>

    <div id="modal">
        <h2 id="modal-title">Título</h2>
        <p id="modal-text">Mensaje</p>
        <button id="close-btn" onclick="document.getElementById('modal').style.display='none'">Cerrar</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030008, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 120;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 6000;
        const posArray = new Float32Array(particlesCount * 3);
        const colorsArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i+=3) {
            const r = 200 * Math.cbrt(Math.random());
            const theta = Math.random() * 2 * Math.PI;
            const phi = Math.acos(2 * Math.random() - 1);
            
            posArray[i] = r * Math.sin(phi) * Math.cos(theta);
            posArray[i+1] = r * Math.sin(phi) * Math.sin(theta);
            posArray[i+2] = r * Math.cos(phi);

            colorsArray[i] = 0.5 + Math.random() * 0.5; 
            colorsArray[i+1] = 0.1 + Math.random() * 0.2; 
            colorsArray[i+2] = 0.7 + Math.random() * 0.3; 
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));

        const particlesMaterial = new THREE.PointsMaterial({ size: 1.5, vertexColors: true, transparent: true, opacity: 0.8 });
        const particleMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particleMesh);

        const memories = [
            { title: "💜 15-01-25 💜", text: "El día en que nuestro universo comenzó a escribirse." },
            { title: "💌 Lara Jean", text: "«Dicen que si miras algo con suficiente atención, desaparece. Pero yo te miro y te vuelves más real.»" },
            { title: "🌧️ Diario de una Pasión", text: "«No será fácil, será muy difícil. Y tendremos que trabajar en esto cada día, pero quiero hacerlo porque te quiero a ti.»" },
            { title: "👣 A Dos Metros de Ti", text: "«Te amo tanto que solo quiero que estés a salvo, incluso si eso significa no estar cerca de ti.»" },
            { title: "✨ Mi Favorita", text: "En este y en todos los universos, te elegiría a ti siempre." }
        ];

        const clickableObjects = [];
        const starGeometry = new THREE.SphereGeometry(3, 16, 16);
        const starMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });

        memories.forEach((mem) => {
            const star = new THREE.Mesh(starGeometry, starMaterial);
            star.position.set((Math.random() - 0.5) * 100, (Math.random() - 0.5) * 100, (Math.random() - 0.5) * 100);
            star.userData = { title: mem.title, text: mem.text };
            scene.add(star);
            clickableObjects.push(star);
            
            const haloGeom = new THREE.SphereGeometry(6, 16, 16);
            const haloMat = new THREE.MeshBasicMaterial({ color: 0xDDA0DD, transparent: true, opacity: 0.4 });
            const halo = new THREE.Mesh(haloGeom, haloMat);
            star.add(halo);
        });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function checkIntersection(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(clickableObjects);
            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                document.getElementById('modal-title').innerText = data.title;
                document.getElementById('modal-text').innerText = data.text;
                document.getElementById('modal').style.display = 'block';
            }
        }

        window.addEventListener('click', (e) => checkIntersection(e.clientX, e.clientY));
        window.addEventListener('touchstart', (e) => checkIntersection(e.touches[0].clientX, e.touches[0].clientY));

        function animate() {
            requestAnimationFrame(animate);
            particleMesh.rotation.y += 0.0008; 
            particleMesh.rotation.x += 0.0003;
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
