<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Universo de May 💜</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #030008; font-family: 'Helvetica', sans-serif; }
        canvas { display: block; cursor: grab; }
        canvas:active { cursor: grabbing; }
        
        #ui { position: absolute; top: 15px; width: 100%; text-align: center; color: #E0B0FF; text-shadow: 0 0 15px #9B59B6; pointer-events: none; z-index: 5; }
        #ui h1 { margin: 0; font-size: 2.2em; letter-spacing: 2px; }
        #ui p { margin: 10px 0 0 0; color: #D8BFD8; font-size: 1.1em; }

        #search-container {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 0, 35, 0.8); border: 2px solid #DDA0DD; border-radius: 30px;
            padding: 10px 20px; display: flex; gap: 10px; z-index: 10; backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
        }
        #coord-input {
            background: transparent; border: none; color: white; font-size: 1em; outline: none;
            text-align: center; width: 180px; font-family: monospace;
        }
        #coord-input::placeholder { color: #D8BFD8; opacity: 0.7; }
        #search-btn {
            background: #9B59B6; border: none; color: white; padding: 8px 20px;
            border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        #search-btn:hover { background: #E0B0FF; color: #30004a; box-shadow: 0 0 10px #E0B0FF; }

        #modal {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(15, 0, 35, 0.95); border: 3px solid #DDA0DD; border-radius: 25px;
            padding: 40px; text-align: center; color: white; box-shadow: 0 0 60px #FF00FF, inset 0 0 20px #9B59B6;
            width: 85%; max-width: 550px; z-index: 100; backdrop-filter: blur(10px);
        }
        #modal h2 { margin: 0 0 20px 0; font-size: 2.5em; color: #E0B0FF; text-shadow: 0 0 15px #DDA0DD; font-weight: bold;}
        #modal p { font-size: 1.7em; line-height: 1.6; font-style: italic; color: #F0F0F0; }
        #modal-coord { display: block; margin-top: 20px; font-size: 1em; color: #9B59B6; font-family: monospace; }
        #close-btn {
            background: linear-gradient(45deg, #9B59B6, #E0B0FF); border: none; color: white; padding: 15px 40px; 
            font-size: 1.3em; border-radius: 50px; cursor: pointer; margin-top: 20px; font-weight: bold;
            box-shadow: 0 5px 25px rgba(155, 89, 182, 0.6); transition: 0.3s;
        }
        #close-btn:hover { transform: scale(1.05); box-shadow: 0 5px 35px rgba(224, 176, 255, 0.8); }
    </style>
</head>
<body>

    <div id="ui">
        <h1>✨ El Universo de May ✨</h1>
        <p>Toca la pantalla para la música 🎵<br>Tienes 200 estrellas por descubrir 👇</p>
    </div>

    <div id="search-container">
        <input type="text" id="coord-input" placeholder="Ej: 15.01.25">
        <button id="search-btn" onclick="searchCoordinate()">Buscar</button>
    </div>

    <audio id="bg-music" loop hidden>
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <div id="modal">
        <h2 id="modal-title">Título</h2>
        <p id="modal-text">Mensaje</p>
        <span id="modal-coord"></span><br>
        <button id="close-btn" onclick="document.getElementById('modal').style.display='none'">Cerrar</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        window.addEventListener('click', function() {
            const audio = document.getElementById('bg-music');
            if (audio.paused) {
                audio.volume = 0.5;
                audio.play().catch(e => console.log("Esperando interacción..."));
            }
        }, { once: true });

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030008, 0.0015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.z = 180;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.2;

        // 1. Galaxia Morada (Polvo estelar visual, no tocable)
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 12000;
        const posArray = new Float32Array(particlesCount * 3);
        const colorsArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i+=3) {
            const r = 350 * Math.cbrt(Math.random());
            const theta = Math.random() * 2 * Math.PI;
            const phi = Math.acos(2 * Math.random() - 1);
            
            posArray[i] = r * Math.sin(phi) * Math.cos(theta);
            posArray[i+1] = r * Math.sin(phi) * Math.sin(theta);
            posArray[i+2] = r * Math.cos(phi) * 0.6; 

            colorsArray[i] = 0.4 + Math.random() * 0.6; 
            colorsArray[i+1] = Math.random() * 0.3; 
            colorsArray[i+2] = 0.6 + Math.random() * 0.4; 
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));
        const particleMesh = new THREE.Points(particlesGeometry, new THREE.PointsMaterial({ size: 1.2, vertexColors: true, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending }));
        scene.add(particleMesh);

        // 2. LAS 200 ESTRELLAS FUNCIONALES
        const clickableObjects = [];
        const starGeometry = new THREE.SphereGeometry(3, 16, 16);
        const starMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const haloGeom = new THREE.SphereGeometry(6.5, 16, 16);
        const haloMat = new THREE.MeshBasicMaterial({ color: 0xE0B0FF, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });

        // A. Mensajes Principales (Coordenadas Exactas)
        const mainMemories = [
            { t: "💜 15-01-25 💜", m: "El día en que nuestro universo comenzó a escribirse.", c: "15.01.25" },
            { t: "💌 Lara Jean", m: "«Dicen que si miras algo con suficiente atención, desaparece. Pero yo te miro y te vuelves más real.»", c: "12.04.18" },
            { t: "🌧️ Diario de una Pasión", m: "«No será fácil, será muy difícil. Y tendremos que trabajar en esto cada día, pero quiero hacerlo porque te quiero a ti.»", c: "365.00.00" },
            { t: "👣 A Dos Metros de Ti", m: "«Te amo tanto que solo quiero que estés a salvo, incluso si eso significa no estar cerca de ti.»", c: "02.00.00" },
            { t: "✨ Mi Favorita", m: "En este y en todos los universos, te elegiría a ti siempre.", c: "99.99.99" }
        ];

        // B. Frases Profundas (Para las 195 estrellas restantes)
        const frasesProfundas = [
            "Eres mi casualidad favorita en este universo lleno de caos.",
            "Si tuviera que vivir mi vida de nuevo, te encontraría antes para amarte más tiempo.",
            "Contigo, hasta el silencio es cómodo y el caos tiene sentido.",
            "Eres la mejor parte de todos mis días.",
            "Me haces sentir que todo lo bonito del mundo me está pasando a mí.",
            "Te miro y sé que estoy exactamente donde debo estar.",
            "Mi lugar favorito para estar es dentro de tus abrazos.",
            "Haces que mi mundo sea más brillante solo con existir en él.",
            "Elegirte fue la decisión más fácil y hermosa que he tomado.",
            "Si el amor fuera una canción, sonaría exactamente como tú.",
            "No necesito buscar magia en el cielo cuando te tengo a ti.",
            "Eres mi pensamiento favorito antes de dormir y al despertar.",
            "Me encanta la versión de mí mismo cuando estoy contigo.",
            "Eres mi paz en medio de la tormenta y mi tormenta favorita.",
            "Cada latido de mi corazón pronuncia tu nombre."
        ];

        // Crear las 200 estrellas
        for(let i = 0; i < 200; i++) {
            const star = new THREE.Mesh(starGeometry, starMaterial);
            const spread = 200;
            star.position.set((Math.random() - 0.5) * spread, (Math.random() - 0.5) * spread, (Math.random() - 0.5) * spread);
            
            let data;
            let haloScale = 1;

            if(i < mainMemories.length) {
                // Las principales
                data = { title: mainMemories[i].t, text: mainMemories[i].m, coord: mainMemories[i].c };
                star.scale.set(1.5, 1.5, 1.5);
                haloScale = 1.5;
            } else {
                // Las de exploración
                let frase = frasesProfundas[Math.floor(Math.random() * frasesProfundas.length)];
                let coordSec = "88." + Math.floor(Math.random() * 90 + 10) + "." + i;
                data = { title: "✨ Un pensamiento", text: frase, coord: coordSec };
            }

            star.userData = data;
            scene.add(star);
            clickableObjects.push(star); // AHORA TODAS SON TOCABLES
            
            const halo = new THREE.Mesh(haloGeom, haloMat);
            halo.scale.set(haloScale, haloScale, haloScale);
            star.add(halo);
        }

        // Sistema de Clicks y Búsqueda
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function openModal(data) {
            controls.autoRotate = false; 
            document.getElementById('modal-title').innerHTML = data.title;
            document.getElementById('modal-text').innerHTML = data.text;
            document.getElementById('modal-coord').innerHTML = "Coordenada: " + data.coord;
            document.getElementById('modal').style.display = 'block';
        }

        function checkIntersection(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(clickableObjects);
            if (intersects.length > 0) {
                openModal(intersects[0].object.userData);
            }
        }

        window.addEventListener('click', (e) => {
            if(e.target.id !== 'coord-input' && e.target.id !== 'search-btn' && e.target.id !== 'close-btn') {
                checkIntersection(e.clientX, e.clientY);
            }
        });
        window.addEventListener('touchstart', (e) => {
            if(e.target.id !== 'coord-input' && e.target.id !== 'search-btn' && e.target.id !== 'close-btn') {
                if(e.touches.length > 0) checkIntersection(e.touches[0].clientX, e.touches[0].clientY);
            }
        });

        window.searchCoordinate = function() {
            const inputVal = document.getElementById('coord-input').value.trim();
            if(!inputVal) return;
            const starFound = clickableObjects.find(star => star.userData.coord === inputVal);
            if(starFound) {
                openModal(starFound.userData);
                document.getElementById('coord-input').value = ""; 
            } else {
                alert("Coordenada '" + inputVal + "' no encontrada. Intenta otra vez.");
            }
        };

        document.getElementById('coord-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') searchCoordinate();
        });

        function animate() {
            requestAnimationFrame(animate);
            particleMesh.rotation.y += 0.0005; 
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
